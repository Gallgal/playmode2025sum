<style>
:root{
  /* Palette */
  --bg:#FFF1DF;      /* background */
  --sage:#C2CAC5;    /* main color */
  --wine:#6E3343;    /* main color */
  --ink:#3D2D2E;     /* sub color */

  /* Derived tokens */
  --fg:var(--ink);
  --muted:rgba(61,45,46,0.82);
  --muted2:rgba(61,45,46,0.62);
  --border:rgba(61,45,46,0.22);
  --card-bg: var(--sage);
}

*{box-sizing:border-box;}
html,body{height:100%;}
html{
  background: var(--bg);
}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  overflow-x:hidden;
  overflow-y:auto;
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  font-weight: 500;
}

.hero{
  min-height:100vh;
  height:auto; /* allow content to extend */
  display:flex;
  align-items:flex-start; /* prevent top cropping */
  justify-content:center;
  padding:48px 24px 24px;
}

.hero-inner{
  width:min(980px, 100%);
  display:grid;
  grid-template-columns: 1fr;
  gap:18px;
}

.brand{
  width:min(1056px, 100%); /* 520 + 520 + gap, but responsive */
  display:flex;
  flex-direction:row; /* desktop: horizontal */
  align-items:center;
  justify-content:center;
  gap:16px;
}

 .title-img{
   width:min(520px, 42vw); /* shrink with viewport until tablet */
   height:auto;
   display:block;
 }

.house-img{
  width:min(520px, 42vw); /* shrink with viewport until tablet */
  height:auto;
  display:block;
  margin-top:0;
}

 /* Fallback tint for external SVG rendered as <img> */
 .title-img.tint-ink{
   /* Approximate #3D2D2E */
   filter: brightness(0) saturate(100%) invert(18%) sepia(10%) saturate(1800%) hue-rotate(315deg) brightness(78%) contrast(108%);
 }

.logo-img{
  width:72px;
  height:72px;
  display:block;
}

/* Recolor external SVGs with palette colors (works best for 1-color SVGs) */
.svg-mask{
  display:block;
  background-color: var(--ink);
  -webkit-mask-repeat:no-repeat;
  -webkit-mask-position:center;
  -webkit-mask-size:contain;
  mask-repeat:no-repeat;
  mask-position:center;
  mask-size:contain;
}

.svg-title{
  background-color: var(--ink);
  -webkit-mask-image: url('./resource/RHtitle.svg');
  mask-image: url('./resource/RHtitle.svg');
}

.svg-logo{
  background-color: var(--wine);
  -webkit-mask-image: url('./resource/logo.svg');
  mask-image: url('./resource/logo.svg');
}

.meta{
  display:grid;
  gap:10px;
  padding:16px 18px;
  border:1px solid var(--border);
  border-radius:16px;
  background: var(--sage);
  margin-top:40px;
}

.meta-row{
  display:flex;
  gap:12px;
  align-items:flex-start;
  line-height:1.35;
}

.meta-label{
  min-width:86px;
  color:var(--muted2);
  letter-spacing:0.2px;
}

.meta-value{
  color:var(--muted);
}

.cta-row{
  display:flex;
  gap:12px;
  align-items:center;
  margin-top:6px;
}

.cta{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:14px 16px;
  border-radius:999px;
  border:1px solid var(--wine);
  background: var(--wine);
  color: var(--sage);
  text-decoration:none;
  font-weight:700;
  letter-spacing:0.2px;
  user-select:none;
  transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
}
.cta:hover{
  transform: translateY(-1px);
  background: #5a2735; /* slightly darker wine */
  border-color:#5a2735;
}
.cta:active{transform: translateY(0px);}

.cta.secondary{
  font-weight:600;
  color:var(--ink);
  border-style:dashed;
}

.small-note{
  color:var(--muted2);
  font-size:12px;
  line-height:1.4;
}

@media (max-width:1024px){
  .brand{
    flex-direction:column; /* mobile: vertical */
    gap:0;
  }
  .brand{justify-content:center;}
  .title-img,
  .house-img{
    width:min(520px, 70vw); /* larger on mobile/tablet */
  }
  .meta{
    margin-top:24px; /* slightly tighter when logo stack is larger */
    margin-bottom:100px;
  }
  .logo-img{width:60px;}
  .meta-label{min-width:76px;}
  .cta-row{flex-direction:column; align-items:stretch;}
  .cta{width:100%;}
}
</style>
</head>
